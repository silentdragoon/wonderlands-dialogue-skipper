[General]
; Enable or disable debug console window
ConsoleEnabled = 0
GuiConsoleEnabled = 0

; Graphics API overrides if needed (Default: 0 - Auto)
GraphicsAPI = 0

[EngineVersionOverride]
; Tiny Tina's Wonderlands uses modified Unreal Engine 4.27
MajorVersion = 4
MinorVersion = 27

[Hooks]
; Enables standard UFunction hook handling
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookLoadMap = 1

[CrashDump]
EnableCrashDumper = 1
